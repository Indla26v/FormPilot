<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1080" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Base Sidebar Gradient -->
    <linearGradient id="menuBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="35%" stop-color="#0c111e" />
      <stop offset="70%" stop-color="#0f1628" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Top Brand Glow -->
    <radialGradient id="menuTopGlow" cx="25%" cy="8%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#080c16" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom Ambient Glow -->
    <radialGradient id="menuBottomGlow" cx="70%" cy="92%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#080c16" stop-opacity="0" />
    </radialGradient>

    <!-- Vertical Wave Gradient -->
    <linearGradient id="menuWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.02" />
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="menuDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#818cf8" fill-opacity="0.07" />
    </pattern>

    <filter id="menuBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="100%" height="100%" fill="url(#menuBgGrad)" />
  <rect width="100%" height="100%" fill="url(#menuTopGlow)" />
  <rect width="100%" height="100%" fill="url(#menuBottomGlow)" />
  <rect width="100%" height="100%" fill="url(#menuDots)" />

  <!-- Vertical Fluid Ribbon -->
  <path d="M0,0 Q180,250 80,500 T120,1080 L0,1080 Z" fill="url(#menuWaveGrad)" filter="url(#menuBlur)" />

  <!-- Subtle Accent Edge Lines -->
  <path d="M5,0 Q185,250 85,500 T125,1080" fill="none" stroke="url(#menuWaveGrad)" stroke-width="1.2" opacity="0.3" />
</svg>
