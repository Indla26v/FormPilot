<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Base Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="40%" stop-color="#090e1a" />
      <stop offset="80%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Radial Blurs -->
    <radialGradient id="indigoGlow" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.14" />
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="60%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </radialGradient>

    <!-- Translucent Wave Ribbon Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="100%" x2="0%" y2="30%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#6366f1" fill-opacity="0.08" />
    </pattern>

    <!-- Soft Diffuse Filter -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <!-- 1. Deep Space Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- 2. Ambient Color Aura Orbs -->
  <rect width="100%" height="100%" fill="url(#indigoGlow)" />
  <rect width="100%" height="100%" fill="url(#cyanGlow)" />
  <rect width="100%" height="100%" fill="url(#purpleGlow)" />

  <!-- 3. Minimal Tech Dot Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#dotGrid)" />

  <!-- 4. Luminous Wave Ribbons -->
  <g opacity="0.6" filter="url(#softBlur)">
    <path d="M-100,200 C300,50 600,450 1100,220 C1600,0 1800,300 2100,150 L2100,600 L-100,600 Z" fill="url(#waveGrad1)" />
    <path d="M-200,650 C400,850 800,500 1300,750 C1700,950 1900,650 2200,800 L2200,1200 L-200,1200 Z" fill="url(#waveGrad2)" />
  </g>

  <!-- 5. Crisp Elegant Accent Lines -->
  <g opacity="0.25" fill="none" stroke-width="1.5">
    <path d="M-50,280 C350,120 700,480 1150,280 C1550,80 1850,320 2050,220" stroke="url(#waveGrad1)" />
    <path d="M-100,720 C450,920 850,560 1350,800 C1750,980 1950,720 2150,840" stroke="url(#waveGrad2)" />
  </g>
</svg>
